services:
  db:
    image: postgres:16
    container_name: peludos_db
    restart: always
    env_file:
      - .env
    # Sin puertos publicados: solo la API llega a la base, por la red interna de Docker
    volumes:
      - peludos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: peludos_api
    restart: always
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    # Usa el CMD del Dockerfile: aplica migraciones y arranca uvicorn sin recarga

volumes:
  peludos_pgdata:
