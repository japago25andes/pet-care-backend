services:
  db:
    image: postgres:16
    container_name: peludos_db
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - peludos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: peludos_api
    restart: always
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    # En desarrollo: aplica migraciones y arranca con recarga automática
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  peludos_pgdata:
